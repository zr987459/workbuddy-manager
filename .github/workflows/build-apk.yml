name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", "mobile/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyMobile-APK
          path: dist/WorkBuddyMobile.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.2
          name: "WorkBuddy Mobile v1.0.2 独立安卓版"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyMobile.apk
          body: |
            ### 📱 WorkBuddy Mobile 独立安卓版 v1.0.2

            - 🚀 **100% 同源架构彻底根除 Failed to fetch**：前端精准映射至 `http://127.0.0.1:7863/m/index.html`，与底层 Go 引擎共享完全相同的 HTTP 域，彻底消除任何 CORS、Mixed Content 与 CORP 限制！
            - ⚡ **本地自洽直通引擎**：免密直连 127.0.0.1:7863，即刻加载账号与概览状态，不再提示连接中断。
            - 🌍 **国际版一键秒级授权**：点击「+ 授权新账号」自动调用官方 OAuth 设备授权流，跳出浏览器登录后 2.5 秒自愈捕获入库！
            - 💬 **即时对话工作台**：原生移动端聊天气泡体验，支持 DeepSeek V4.1、GLM 等模型实时流式打字机输出与折叠思维链！
            - 🛠️ **完整后台快捷入口**：顶部一键切换高级原生控制台。

            *点击下方 Assets 里的 `WorkBuddyMobile.apk` 下载平滑覆盖升级！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
