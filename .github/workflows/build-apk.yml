name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", "mobile/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyMobile-APK
          path: dist/WorkBuddyMobile.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.1
          name: "WorkBuddy Mobile v1.0.1 独立安卓版"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyMobile.apk
          body: |
            ### 📱 WorkBuddy Mobile 独立安卓版 v1.0.1

            - 🚀 **彻底解决 Failed to fetch**：采用官方标准 HTTPS `WebViewAssetLoader` 虚拟域替代 `file://`，全链路跨域阻断与相对路径问题彻底根除！
            - ⚡ **本地自洽直通引擎**：移动端直连内置原生守护核心（127.0.0.1:7863），无需密码，免密直达，秒级响应。
            - 🌍 **国际版全自动授权**：点击「+ 授权新账号」获取授权链接并在浏览器完成登录，App 后台 2.5 秒自愈轮询秒级入库！
            - 💬 **即时对话工作台**：原生移动端对话界面，支持 DeepSeek V4.1、GLM 等模型实时流式打字机输出与折叠思维链抽屉！
            - 🛠️ **完整控制台一键切换**：顶部新增「完整后台」快捷切换按钮，随时在极简移动端与高级原生面板间丝滑切换。

            *点击下方 Assets 里的 `WorkBuddyMobile.apk` 下载平滑覆盖升级！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
