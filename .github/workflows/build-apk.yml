name: Build WorkBuddy Mobile APK

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", "mobile/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/WorkBuddyMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyMobile-APK
          path: dist/WorkBuddyMobile.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.0
          name: "WorkBuddy Mobile v1.0.0 独立安卓版"
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/WorkBuddyMobile.apk
          body: |
            ### 📱 WorkBuddy Mobile 独立安卓版 v1.0.0

            - 🚀 **100% 独立离线自洽**：内置原生底层核心引擎，无需 Termux、无需电脑或外部服务器，手机点击 App 图标自动拉起！
            - 🎨 **重构移动端 UI**：iOS / Material 3 浮动胶囊底栏，四大模块（概览 · 账号 · 密钥 · 对话）触屏卡片流。
            - 🌍 **国际服专属通道**：彻底精简国内复杂的碎包积分、任务与红包，专注海外账号与大模型 API 调用。
            - 💬 **即时对话工作台**：支持 DeepSeek V4.1、GLM 等模型流式打字机输出与折叠式思维链抽屉！

            *点击下方 Assets 里的 `WorkBuddyMobile.apk` 即可下载安装到安卓手机！*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
